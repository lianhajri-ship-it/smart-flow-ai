<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>Smart Flow AI</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/style.css">
</head>
<body>
  <main class="container">
    <!-- كل عنصر فيه data-i18n يُستبدل نصه حسب اللغة من ملف app.js -->
    <header class="hero">
      <div class="topbar">
        <span class="logo">⚡ Smart Flow AI</span>
        <button class="lang-toggle" id="lang-toggle" type="button" data-i18n="switchLanguage">English</button>
      </div>
      <h1 data-i18n="heroTitle">بيانات فاتورتك في ثوانٍ</h1>
      <p class="subtitle" data-i18n="heroSubtitle"></p>
    </header>

    <!-- 1) الرفع -->
    <section class="card" id="upload-card">
      <label class="dropzone" id="dropzone" for="file-input">
        <span class="dropzone-icon" aria-hidden="true">📄</span>
        <strong data-i18n="dropTitle"></strong>
        <span class="hint" data-i18n="dropHint"></span>
      </label>
      <input type="file" id="file-input" accept=".pdf,image/png,image/jpeg,image/webp" hidden>
      <!-- capture تفتح الكاميرا الخلفية مباشرة على الجوال -->
      <input type="file" id="camera-input" accept="image/*" capture="environment" hidden>
      <button class="btn btn-primary" id="camera-btn" type="button" data-i18n="cameraButton"></button>
      <p class="privacy" data-i18n="privacy"></p>
    </section>

    <!-- 2) جارٍ المعالجة -->
    <section class="card hidden" id="status-card" aria-live="polite">
      <div class="spinner" aria-hidden="true"></div>
      <p data-i18n="loading"></p>
    </section>

    <!-- 3) النتيجة -->
    <section class="card hidden" id="result-card" aria-live="polite">
      <div class="result-header">
        <span class="badge" id="result-badge"></span>
      </div>

      <dl class="fields" id="fields">
        <div class="field"><dt data-i18n="seller"></dt><dd id="f-seller"></dd></div>
        <div class="field"><dt data-i18n="vatNumber"></dt><dd class="ltr nowrap" id="f-vat-number"></dd></div>
        <div class="field"><dt data-i18n="date"></dt><dd class="ltr nowrap" id="f-date"></dd></div>
        <div class="field"><dt data-i18n="vatAmount"></dt><dd class="nowrap" id="f-vat"></dd></div>
        <div class="field field-total"><dt data-i18n="total"></dt><dd class="nowrap" id="f-total"></dd></div>
      </dl>

      <div class="not-found hidden" id="not-found">
        <p data-i18n="notFoundIntro"></p>
        <ul>
          <li data-i18n="tipCloseUp"></li>
          <li data-i18n="tipLight"></li>
          <li data-i18n="tipFlat"></li>
        </ul>
      </div>

      <button class="btn btn-secondary" id="reset-btn" type="button" data-i18n="readAnother"></button>
    </section>

    <!-- 4) خطأ -->
    <section class="card card-error hidden" id="error-card" role="alert">
      <p id="error-message"></p>
      <button class="btn btn-secondary" id="error-reset-btn" type="button" data-i18n="tryAgain"></button>
    </section>

    <footer class="footer">
      <!-- bdi يعزل النص الإنجليزي حتى لا ينقلب ترتيبه داخل الصفحة العربية -->
      <p><bdi dir="ltr">© 2026 Lina Alhajri.</bdi> <span data-i18n="rightsReserved"></span></p>
      <p>Smart Flow AI • <a href="/docs">API Docs</a></p>
    </footer>
  </main>

  <script src="/app.js"></script>
</body>
</html>
